[workspace]
members = ["crates/*"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryusen-sys/cel"
homepage = "https://github.com/ryusen-sys/cel"
readme = "README.md"
authors = ["ponix-dev", "Ryusen contributors"]

[workspace.dependencies]
logos = "0.14"
prost = "0.14"
prost-reflect = "0.16"
regex = "1.10"
cel-core = { path = "crates/cel-core", version = "0.5.1" }
cel-core-proto = { path = "crates/cel-core-proto", version = "0.5.1" }
